<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow">
      <div class="card-header bg-dark text-white text-center">
        <h4 class="mb-0"><i class="bi bi-kanban me-2"></i>Gestion Projets & Tâches</h4>
      </div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">Nom d'utilisateur</label>
          <input type="text" class="form-control" [(ngModel)]="username" (keyup.enter)="onLogin()" placeholder="admin">
        </div>
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <input type="password" class="form-control" [(ngModel)]="password" (keyup.enter)="onLogin()" placeholder="••••••••">
        </div>
        <button class="btn btn-dark w-100" (click)="onLogin()" [disabled]="loading">
          <i class="bi bi-box-arrow-in-right me-1"></i>
          {{ loading ? 'Connexion...' : 'Se connecter' }}
        </button>
        <p class="text-muted small mt-3 mb-0">
          Comptes de démo : <code>admin / admin123</code> ou <code>chef / chef123</code>
        </p>
      </div>
    </div>
  </div>
</div>
